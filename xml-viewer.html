<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Studio - Viewer & Formatter</title>
  <link 
    rel="icon" 
    type="image/svg+xml" 
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M30 35 L15 50 L30 65' stroke='%2361dafb' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M70 35 L85 50 L70 65' stroke='%2361dafb' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><text x='50' y='60' fill='%23f43f5e' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='32' text-anchor='middle'>JSX</text></svg>" 
  />
  <link rel="stylesheet" href="xml-viewer.css">
</head>
<body>

  <header class="top-nav">
    <div class="brand">
      XML <span>Studio</span>
    </div>
    <div class="nav-tabs">
      <div class="lang-switcher-wrapper">
        <div class="lang-toggle-container">
          <a href="index.html" class="inactive-lang">JSON</a>
          <a href="xml-viewer.html" class="active-lang">XML</a>
        </div>
        <p class="lang-label">Language</p>
      </div>

      <a href="xml-viewer.html" class="tab-link active">🛠 Viewer & Tree</a>
      <a href="xml-diff.html" class="tab-link" id="nav-to-diff">⚖️ In-Line Diff Compare</a>
      
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Dark Theme</span>
      </button>
    </div>
  </header>

  <main class="main-view">
    <div class="app-container single-pane" id="app-container">
      
      <div class="pane">
        <div class="header">
          <span>Raw XML Editor</span>
          <div class="actions">
            <div class="search-box">
              <input type="text" id="raw-search-input" class="search-input" placeholder="Search text..." />
              <span id="raw-search-count" class="search-count">0/0</span>
              <button id="raw-search-prev" class="search-nav-btn" title="Previous (Shift+Enter)">▲</button>
              <button id="raw-search-next" class="search-nav-btn" title="Next (Enter)">▼</button>
            </div>

            <button id="btn-format" class="primary">Format</button>
            <button id="btn-minify">Minify</button>
            <button id="btn-clear">Clear</button>
            
            <div class="switch-container">
              <label class="switch">
                <input type="checkbox" id="tree-toggle" />
                <span class="slider"></span>
              </label>
              <span class="switch-label">Tree View</span>
            </div>
          </div>
        </div>

        <div class="editor-wrapper">
          <div class="line-numbers" id="line-numbers"></div>
          <div class="textarea-container">
            <div id="raw-backdrop"></div>
            <textarea id="xml-input" spellcheck="false" placeholder="Paste or type XML here..."></textarea>
          </div>
        </div>
        <div class="editor-footer" id="editor-footer">
          <span style="color: var(--text-muted);">Status: Ready</span>
        </div>
      </div>

      <div class="pane" id="tree-pane">
        <div class="header">
          <span>XML Node Hierarchy</span>
          <div class="actions">
            <div class="search-box">
              <input type="text" id="tree-search-input" class="search-input" placeholder="Search tree..." />
              <span id="tree-search-count" class="search-count">0/0</span>
              <button id="tree-search-prev" class="search-nav-btn" title="Previous match (Shift+Enter)">▲</button>
              <button id="tree-search-next" class="search-nav-btn" title="Next match (Enter)">▼</button>
            </div>

            <button id="btn-expand-all">Expand All</button>
            <button id="btn-collapse-all">Collapse All</button>
            <button id="btn-close-tree" style="background:transparent; border:none; color:var(--text-muted); font-size:14px; cursor:pointer;" title="Close Tree View">✕</button>
          </div>
        </div>
        <div id="viewer-output"></div>
      </div>

    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-left">
      <div class="engine-status">
        <span class="pulse-dot" title="Running locally in browser memory"></span>
        <code>&gt;_ Local Engine</code>
      </div>
      <span class="sep">|</span>
      <span class="privacy-note">
        🔒 <strong>100% Client-Side</strong> <span class="dim">— Zero server uploads. Data never leaves your browser.</span>
      </span>
    </div>
    <div class="footer-right">
      <div class="metric-tags">
        <span>Zero Latency</span>
        <span class="dot">•</span>
        <span>No Tracking</span>
        <span class="dot">•</span>
        <span>In-Memory Only</span>
      </div>
      <span class="footer-badge">⚡ Private &amp; Offline</span>
    </div>
  </footer>

<script src="xml-viewer.js"></script>
</body>
</html>
