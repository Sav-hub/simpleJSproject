<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Studio - Side-by-Side Diff</title>
  <link 
    rel="icon" 
    type="image/svg+xml" 
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M30 35 L15 50 L30 65' stroke='%2361dafb' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M70 35 L85 50 L70 65' stroke='%2361dafb' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><text x='50' y='60' fill='%23f43f5e' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='32' text-anchor='middle'>JSX</text></svg>" 
  />
  <link rel="stylesheet" href="diff.css">
</head>
<body>

  <header class="top-nav">
    <div class="brand">
      JSON <span>Studio</span>
    </div>
    <div class="nav-tabs">
      <div class="lang-switcher-wrapper">
        <div class="lang-toggle-container">
          <a href="diff.html" class="active-lang">JSON</a>
          <a href="xml-diff.html" class="inactive-lang">XML</a>
        </div>
      </div>

      <a href="index.html" class="tab-link" id="nav-to-viewer">🛠 Viewer & Tree</a>
      <a href="diff.html" class="tab-link active">⚖️ In-Line Diff Compare</a>
      
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="main-view">
    <!-- Single Unified Action Toolbar -->
    <div class="unified-control-bar">
      <!-- Left Controls (Original) -->
      <div class="control-segment left-segment">
        <span class="segment-title">Original JSON</span>
      </div>

      <!-- Center Shared Tools & Filters -->
      <div class="control-segment center-segment">
        <button class="sync-scroll-btn active" id="btn-sync-scroll" title="Synchronize scrolling between both editors">
          <span class="status-dot"></span>
          <span id="sync-scroll-label">Sync Scroll</span>
        </button>

        <button id="btn-diff-swap" class="icon-btn" title="Swap Original and Modified">⇄</button>

        <!-- Semantic Sort Keys Button -->
        <button id="btn-diff-sort-keys" class="icon-btn" title="Recursively sort JSON keys alphabetically in both panes">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24">
              <path d="M3 6h18M6 12h12M9 18h6"/>
            </svg>
          </span>
          <span class="btn-text">Sort Keys</span>
        </button>
        <!-- Diff Jump Navigation -->
        <div class="diff-nav-group" title="Navigate between diffs">
          <button id="btn-jump-prev" class="icon-btn" title="Previous difference (Shift + F7)" disabled>
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <span id="diff-jump-counter" class="diff-jump-counter">0 / 0</span>
          <button id="btn-jump-next" class="icon-btn" title="Next difference (F7)" disabled>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="diff-filters">
          <button class="filter-btn filter-all active" id="filter-btn-all">All</button>
          <button class="filter-btn filter-add" id="filter-btn-add">+ 0</button>
          <button class="filter-btn filter-del" id="filter-btn-del">- 0</button>
          <button class="filter-btn filter-mod" id="filter-btn-mod">~ 0</button>
        </div>

        <button class="icon-btn danger" id="btn-diff-clear-all" title="Clear Both Editors">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </span>
          <span class="btn-text">Clear All</span>
        </button>
      </div>

      <!-- Right Controls (Modified) -->
      <div class="control-segment right-segment">
        
        <span class="segment-title">Modified JSON</span>
      </div>
    </div>

    <!-- Dual Editor Panes -->
    <div class="app-container">
      <div class="pane">
        <div class="editor-wrapper">
          <div class="line-numbers" id="diff-lines-left"></div>
          <div class="textarea-container">
            <div id="diff-backdrop-left" class="backdrop-layer"></div>
            <textarea id="diff-input-left" spellcheck="false" placeholder="Paste original JSON..."></textarea>
          </div>
        </div>
      </div>

      <div class="pane">
        <div class="editor-wrapper">
          <div class="line-numbers" id="diff-lines-right"></div>
          <div class="textarea-container">
            <div id="diff-backdrop-right" class="backdrop-layer"></div>
            <textarea id="diff-input-right" spellcheck="false" placeholder="Paste modified JSON..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-left">
      <div class="engine-status">
        <span class="pulse-dot" title="Running locally in browser memory"></span>
        <code>&gt;_ Local Engine</code>
      </div>
      <span class="sep">|</span>
      <span class="privacy-note">
        🔒 <strong>100% Client-Side</strong> <span class="dim">— Zero server uploads. Data never leaves your browser.</span>
      </span>
    </div>
    <div class="footer-right">
      <div class="metric-tags">
        <span>Zero Latency</span>
        <span class="dot">•</span>
        <span>No Tracking</span>
        <span class="dot">•</span>
        <span>In-Memory Only</span>
      </div>
      <span class="footer-badge">⚡ Private &amp; Offline</span>
    </div>
  </footer>

<script src="diff.js"></script>
<script src="index.js"></script>
</body>
</html>
