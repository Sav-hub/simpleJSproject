    .switch-container {

    .switch {

      width: 34px;
      height: 18px;

    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .25s;
      transition: .25s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }
    input:checked + .slider:before { transform: translateX(16px); }

      let quoteCount = 0;

            });
          }
          break;

      }

      if (trimmed.endsWith(',') && i + 1 < lines.length) {
        for (let j = i + 1; j < lines.length; j++) {

          if (!nextTrimmed) continue;
          if (nextTrimmed.startsWith('}') || nextTrimmed.startsWith(']')) {
            errors.push({
              line: lineNum,
              msg: `Trailing comma before closing bracket <code>${nextTrimmed[0]}</code>.`,
              hint: `Remove the trailing comma.`
            });
          }
          break;
        }
      }

      let inString = false;
      for (let c = 0; c < originalLine.length; c++) {
        const char = originalLine[c];
        if (char === '"' && (c === 0 || originalLine[c - 1] !== '\\')) {
          inString = !inString;

        if (!inString) {
          if (char === '{' || char === '[') {

                  hint: `Ensure matching brackets.`
                });
              }
            }
          }
        }
      }
    }

    while (stack.length > 0) {
      const unclosed = stack.pop();
      errors.push({
        line: unclosed.line,
        msg: `Unclosed bracket <code>${unclosed.char}</code>.`,
        hint: `Missing closing bracket <code>${unclosed.char === '{' ? '}' : ']'}</code>.`

    const isArray = Array.isArray(val);
    const isObject = val !== null && typeof val === 'object';
    const container = document.createElement('div');

    if (isObject) {
      const keys = Object.keys(val);

      const closeBracket = isArray ? ']' : '}';
      const count = keys.length;

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function applyRawSearch() {
    const query = rawSearchInput.value;
    const text = jsonInput.value;
    rawSearchIndices = [];
    currentRawMatchIndex = -1;

    if (!query) {
      rawBackdrop.innerHTML = '';
      rawSearchCount.textContent = '0/0';
      return;
    }

    const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let match;
    while ((match = regex.exec(text)) !== null) {
      rawSearchIndices.push({ start: match.index, end: match.index + match[0].length });
    }

    if (rawSearchIndices.length > 0) {
      currentRawMatchIndex = 0;
      updateRawHighlights();
    } else {
      rawBackdrop.innerHTML = escapeHtml(text);
      rawSearchCount.textContent = '0/0';
    }
  }

  function updateRawHighlights() {
    const text = jsonInput.value;
    if (rawSearchIndices.length === 0) {
      rawBackdrop.innerHTML = '';
      rawSearchCount.textContent = '0/0';
      return;
    }

    let html = '';
    let lastIndex = 0;

    rawSearchIndices.forEach((pos, idx) => {
      html += escapeHtml(text.substring(lastIndex, pos.start));
      const matchText = escapeHtml(text.substring(pos.start, pos.end));
      const isActive = idx === currentRawMatchIndex;
      html += `<mark class="highlight ${isActive ? 'active-match' : ''}">${matchText}</mark>`;
      lastIndex = pos.end;
    });
    html += escapeHtml(text.substring(lastIndex));

    rawBackdrop.innerHTML = html;
    rawSearchCount.textContent = `${currentRawMatchIndex + 1}/${rawSearchIndices.length}`;

    // Auto-scroll raw textarea to the active match
    if (currentRawMatchIndex >= 0) {
      const active = rawSearchIndices[currentRawMatchIndex];
      const upToMatch = text.substring(0, active.start);
      const lineNumber = upToMatch.split('\n').length;
      const lineHeight = 19.5;
      const targetScroll = (lineNumber - 4) * lineHeight;
      jsonInput.scrollTop = Math.max(0, targetScroll);
      lineNumbers.scrollTop = jsonInput.scrollTop;
      rawBackdrop.scrollTop = jsonInput.scrollTop;
    }
  }

  function navigateRawSearch(direction) {
    if (rawSearchIndices.length === 0) return;
    currentRawMatchIndex = (currentRawMatchIndex + direction + rawSearchIndices.length) % rawSearchIndices.length;
    updateRawHighlights();
  }

  rawSearchInput.addEventListener('input', applyRawSearch);
  rawSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigateRawSearch(e.shiftKey ? -1 : 1);
    }
  });
  rawSearchNext.addEventListener('click', () => navigateRawSearch(1));
  rawSearchPrev.addEventListener('click', () => navigateRawSearch(-1));

  // ==========================================
  // SEARCH 2: Tree Hierarchy Search
  // ==========================================
  function highlightTreeNodes(element, query) {
    if (!query) return;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const targets = element.querySelectorAll('[data-search-target="true"]');

    targets.forEach(node => {
      const text = node.textContent;
      if (regex.test(text)) {
        node.innerHTML = text.replace(regex, '<mark class="highlight">$1</mark>');
        
        // Auto-expand collapsed parents
        let parent = node.closest('.tree-item.collapsed');
        while (parent) {
          parent.classList.remove('collapsed');
          parent = parent.parentElement ? parent.parentElement.closest('.tree-item.collapsed') : null;
        }
      }
    });
  }

  function applyTreeSearch() {
    if (!treeToggle.checked) return;

    const query = treeSearchInput.value.trim();
    treeMatches = [];
    currentTreeMatchIndex = -1;

    if (!query) {
      treeSearchCount.textContent = '0/0';
      return;
    }

    highlightTreeNodes(viewerOutput, query);
    treeMatches = Array.from(viewerOutput.querySelectorAll('mark.highlight'));

    if (treeMatches.length > 0) {
      currentTreeMatchIndex = 0;
      updateActiveTreeMatch();
    } else {
      treeSearchCount.textContent = '0/0';
    }
  }

  function updateActiveTreeMatch() {
    if (treeMatches.length === 0) {
      treeSearchCount.textContent = '0/0';
      return;
    }

    treeMatches.forEach((el, i) => {
      if (i === currentTreeMatchIndex) {
        el.classList.add('active-match');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        el.classList.remove('active-match');
      }
    });

    treeSearchCount.textContent = `${currentTreeMatchIndex + 1}/${treeMatches.length}`;
  }

  function navigateTreeSearch(direction) {
    if (treeMatches.length === 0) return;
    currentTreeMatchIndex = (currentTreeMatchIndex + direction + treeMatches.length) % treeMatches.length;
    updateActiveTreeMatch();
  }

  treeSearchInput.addEventListener('input', () => {
    if (treeToggle.checked) {
      validateAndProcess();
    }
  });

  treeSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigateTreeSearch(e.shiftKey ? -1 : 1);
    }
  });

  treeSearchNext.addEventListener('click', () => navigateTreeSearch(1));
  treeSearchPrev.addEventListener('click', () => navigateTreeSearch(-1));

  // ==========================================
  // Action Handlers
  // ==========================================
  function applyRawSearch() {
    const query = rawSearchInput.value;
    const text = jsonInput.value;
    rawSearchIndices = [];
    currentRawMatchIndex = -1;

    if (!query) {
      rawBackdrop.innerHTML = '';
      rawSearchCount.textContent = '0/0';
      return;
    }

    const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let match;
    while ((match = regex.exec(text)) !== null) {
      rawSearchIndices.push({ start: match.index, end: match.index + match[0].length });
    }

    if (rawSearchIndices.length > 0) {
      currentRawMatchIndex = 0;
      updateRawHighlights();
    } else {
      rawBackdrop.innerHTML = escapeHtml(text);
      rawSearchCount.textContent = '0/0';
    }
  }

  function updateRawHighlights() {
    const text = jsonInput.value;
    if (rawSearchIndices.length === 0) {
      rawBackdrop.innerHTML = '';
      rawSearchCount.textContent = '0/0';
      return;
    }

    let html = '';
    let lastIndex = 0;

    rawSearchIndices.forEach((pos, idx) => {
      html += escapeHtml(text.substring(lastIndex, pos.start));
      const matchText = escapeHtml(text.substring(pos.start, pos.end));
      const isActive = idx === currentRawMatchIndex;
      html += `<mark class="highlight ${isActive ? 'active-match' : ''}">${matchText}</mark>`;
      lastIndex = pos.end;
    });
    html += escapeHtml(text.substring(lastIndex));
    rawBackdrop.innerHTML = html;
    rawSearchCount.textContent = `${currentRawMatchIndex + 1}/${rawSearchIndices.length}`;

    if (currentRawMatchIndex >= 0) {
      const active = rawSearchIndices[currentRawMatchIndex];
      const lineNumber = text.substring(0, active.start).split('\n').length;
      jsonInput.scrollTop = Math.max(0, (lineNumber - 4) * 19.5);
      lineNumbers.scrollTop = jsonInput.scrollTop;
      rawBackdrop.scrollTop = jsonInput.scrollTop;
    }
  }

  function navigateRawSearch(dir) {
    if (rawSearchIndices.length === 0) return;
    currentRawMatchIndex = (currentRawMatchIndex + dir + rawSearchIndices.length) % rawSearchIndices.length;
    updateRawHighlights();
  }

  rawSearchInput.addEventListener('input', applyRawSearch);
  rawSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigateRawSearch(e.shiftKey ? -1 : 1);
    }
  });
  rawSearchNext.addEventListener('click', () => navigateRawSearch(1));
  rawSearchPrev.addEventListener('click', () => navigateRawSearch(-1));

  function highlightTreeNodes(element, query) {
    if (!query) return;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    const targets = element.querySelectorAll('[data-search-target="true"]');
    targets.forEach(node => {
      const text = node.textContent;
      if (regex.test(text)) {
        node.innerHTML = text.replace(regex, '<mark class="highlight">$1</mark>');
        let parent = node.closest('.tree-item.collapsed');
        while (parent) {
          parent.classList.remove('collapsed');
          parent = parent.parentElement ? parent.parentElement.closest('.tree-item.collapsed') : null;
        }
      }
    });
  }

  function applyTreeSearch() {
    if (!treeToggle.checked) return;
    const query = treeSearchInput.value.trim();
    treeMatches = [];
    currentTreeMatchIndex = -1;

    if (!query) {
      treeSearchCount.textContent = '0/0';
      return;
    }

    highlightTreeNodes(viewerOutput, query);
    treeMatches = Array.from(viewerOutput.querySelectorAll('mark.highlight'));
    if (treeMatches.length > 0) {
      currentTreeMatchIndex = 0;
      updateActiveTreeMatch();
    } else {
      treeSearchCount.textContent = '0/0';
    }
  }

  function updateActiveTreeMatch() {
    if (treeMatches.length === 0) {
      treeSearchCount.textContent = '0/0';
      return;
    }
    treeMatches.forEach((el, i) => {
      if (i === currentTreeMatchIndex) {
        el.classList.add('active-match');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        el.classList.remove('active-match');
      }
    });
    treeSearchCount.textContent = `${currentTreeMatchIndex + 1}/${treeMatches.length}`;
  }

  function navigateTreeSearch(dir) {
    if (treeMatches.length === 0) return;
    currentTreeMatchIndex = (currentTreeMatchIndex + dir + treeMatches.length) % treeMatches.length;
    updateActiveTreeMatch();
  }

  treeSearchInput.addEventListener('input', () => { if (treeToggle.checked) validateAndProcess(); });
  treeSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigateTreeSearch(e.shiftKey ? -1 : 1);
    }
  });
  treeSearchNext.addEventListener('click', () => navigateTreeSearch(1));
  treeSearchPrev.addEventListener('click', () => navigateTreeSearch(-1));

  document.getElementById('btn-format').addEventListener('click', () => {
    try {
      const obj = JSON.parse(jsonInput.value);
      jsonInput.value = JSON.stringify(obj, null, 2);
      validateAndProcess();
      applyRawSearch();
    } catch { validateAndProcess(); }
      jsonInput.value = JSON.stringify(JSON.parse(jsonInput.value), null, 2);
      validateAndProcess();
      applyRawSearch();
    } catch { validateAndProcess(); }
  });

  document.getElementById('btn-minify').addEventListener('click', () => {
    try {
      const obj = JSON.parse(jsonInput.value);
      jsonInput.value = JSON.stringify(obj);
      validateAndProcess();
      applyRawSearch();
    } catch { validateAndProcess(); }
      jsonInput.value = JSON.stringify(JSON.parse(jsonInput.value));
      validateAndProcess();
      applyRawSearch();
    } catch { validateAndProcess(); }
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    jsonInput.value = '';
    rawSearchInput.value = '';
    treeSearchInput.value = '';
    rawSearchCount.textContent = '0/0';
    treeSearchCount.textContent = '0/0';
    validateAndProcess();
    applyRawSearch();
    rawSearchInput.value = '';
    treeSearchInput.value = '';
    rawSearchCount.textContent = '0/0';
    treeSearchCount.textContent = '0/0';
    validateAndProcess();
    applyRawSearch();
  });

  document.getElementById('btn-expand-all').addEventListener('click', () => {
    document.querySelectorAll('#viewer-output .tree-item.collapsed').forEach(el => el.classList.remove('collapsed'));
  });

  document.getElementById('btn-collapse-all').addEventListener('click', () => {
    document.querySelectorAll('#viewer-output .tree-item').forEach(el => {
      if (el.querySelector('.tree-children')) el.classList.add('collapsed');
    });
  });

  // Initial Execution
  // Initial Load from localStorage or Default
  const savedJson = localStorage.getItem('shared_json_left');
  if (savedJson) {
    jsonInput.value = savedJson;
  } else {
    jsonInput.value = JSON.stringify({
      "application": "JSON Viewer Suite",
      "version": 3,
      "isActive": true,
      "license": null,
      "settings": {
        "theme": "dark",
        "fontSize": 13,
        "features": {
          "liveReload": true,
          "codeFolding": true,
          "nestedDepthLimit": 10
        }
      },
      "modules": [
        { "id": 101, "name": "Parser Engine", "stable": true },
        { "id": 102, "name": "Tree Visualizer", "stable": true }
      ]
    }, null, 2);
  }

  updateLineNumbers();
  validateAndProcess();
  validateAndProcess();
</script>
</body>
</html>
