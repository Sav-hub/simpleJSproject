<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Tree Viewer & Formatter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel-bg: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --text-muted: #6b7280;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --key-color: #38bdf8;
      --str-color: #4ade80;
      --num-color: #fb923c;
      --bool-color: #c084fc;
      --null-color: #f43f5e;
      --gutter-bg: #0d1321;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-border: rgba(239, 68, 68, 0.3);
      --error-text: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: calc(100vh - 32px);
      transition: grid-template-columns 0.25s ease;
    }

    .app-container.single-pane {
      grid-template-columns: 1fr;
    }

    .pane {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #151d30;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #374151; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); }

    /* Switch Slider */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }
    .switch-label {
      font-size: 12px;
      color: var(--text-muted);
      user-select: none;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .25s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Editor with Line Numbers */
    .editor-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background: #0d1117;
    }
    .line-numbers {
      width: 48px;
      padding: 14px 8px 14px 0;
      text-align: right;
      background: var(--gutter-bg);
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .line-numbers div { height: 19.5px; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }

    /* Tree View Output */
    #viewer-output {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .tree-item {
      margin-left: 18px;
      position: relative;
    }
    .tree-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
      cursor: default;
    }
    .caret-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      font-size: 10px;
      border-radius: 3px;
      transition: transform 0.15s ease;
    }
    .caret-btn:hover { color: #fff; background: #2d3748; }

    .collapsed > .tree-row > .caret-btn {
      transform: rotate(-90deg);
    }
    .collapsed > .tree-children {
      display: none;
    }
    .collapsed > .tree-row .badge-summary {
      display: inline-block;
    }

    .badge-summary {
      display: none;
      background: #1f2937;
      color: var(--text-muted);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .badge-summary:hover { color: var(--text); }

    .bracket { color: #94a3b8; font-weight: bold; }
    .key { color: var(--key-color); }
    .str { color: var(--str-color); }
    .num { color: var(--num-color); }
    .bool { color: var(--bool-color); }
    .null { color: var(--null-color); font-weight: bold; }
    .comma { color: #94a3b8; }

    /* Error Notification Box */
    .error-box {
      color: var(--error-text);
      background: var(--error-bg);
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid var(--error-border);
      line-height: 1.6;
    }
    .error-badge {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .error-loc {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(239, 68, 68, 0.2);
      font-size: 12px;
      color: #fca5a5;
    }
  </style>
</head>
<body>

<div class="app-container" id="app-container">
  <!-- Raw JSON Pane with Slider Switch -->
  <div class="pane">
    <div class="header">
      <span>Raw JSON</span>
      <div class="actions">
        <button id="btn-format" class="primary">Format</button>
        <button id="btn-minify">Minify</button>
        <button id="btn-clear">Clear</button>
        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="tree-toggle" checked />
            <span class="slider"></span>
          </label>
          <span class="switch-label">Tree View</span>
        </div>
      </div>
    </div>
    <div class="editor-wrapper">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="json-input" spellcheck="false" placeholder="Paste or type JSON here...">
{
  "application": "JSON Viewer Suite",
  "version": 3,
  "isActive": true,
  "license": null,
  "settings": {
    "theme": "dark",
    "fontSize": 13,
    "features": {
      "liveReload": true,
      "codeFolding": true,
      "nestedDepthLimit": 10
    }
  },
  "modules": [
    {
      "id": 101,
      "name": "Parser Engine",
      "stable": true,
      "module": [
        {
          "id": 101,
          "name": "Parser Engine",
          "stable": true
        },
        {
          "id": 102,
          "name": "Tree Visualizer",
          "stable": true
        }
      ]
    },
    {
      "id": 102,
      "name": "Tree Visualizer",
      "stable": true
    }
  ]
}</textarea>
    </div>
  </div>

  <!-- Tree View Output Pane -->
  <div class="pane" id="tree-pane">
    <div class="header">
      <span>Tree Hierarchy</span>
      <div class="actions">
        <button id="btn-expand-all">Expand All</button>
        <button id="btn-collapse-all">Collapse All</button>
      </div>
    </div>
    <div id="viewer-output"></div>
  </div>
</div>

<script>
  const jsonInput = document.getElementById('json-input');
  const lineNumbers = document.getElementById('line-numbers');
  const treePane = document.getElementById('tree-pane');
  const appContainer = document.getElementById('app-container');
  const treeToggle = document.getElementById('tree-toggle');
  const viewerOutput = document.getElementById('viewer-output');

  // 1. Line Numbers Generation & Scrolling Sync
  function updateLineNumbers() {
    const lines = jsonInput.value.split('\n').length;
    let html = '';
    for (let i = 1; i <= lines; i++) {
      html += `<div>${i}</div>`;
    }
    lineNumbers.innerHTML = html;
  }

  jsonInput.addEventListener('input', () => {
    updateLineNumbers();
    if (treeToggle.checked) {
      parseAndRenderTree();
    }
  });

  jsonInput.addEventListener('scroll', () => {
    lineNumbers.scrollTop = jsonInput.scrollTop;
  });

  // 2. Tree View Toggle (Show/Hide Pane)
  treeToggle.addEventListener('change', (e) => {
    if (e.target.checked) {
      treePane.style.display = 'flex';
      appContainer.classList.remove('single-pane');
      parseAndRenderTree();
    } else {
      treePane.style.display = 'none';
      appContainer.classList.add('single-pane');
    }
  });

  // 3. Error Location Detection (Line & Column Calculation)
  function getErrorLocation(raw, err) {
    // Check if error message explicitly provides line/column
    const lineColMatch = err.message.match(/line (\d+) column (\d+)/i) || err.message.match(/at line (\d+) column (\d+)/i);
    if (lineColMatch) {
      return { line: parseInt(lineColMatch[1], 10), column: parseInt(lineColMatch[2], 10) };
    }

    // Check if character position is provided (e.g. "at position 245")
    const posMatch = err.message.match(/position (\d+)/i);
    if (posMatch) {
      const pos = parseInt(posMatch[1], 10);
      const textUpToError = raw.slice(0, pos);
      const lines = textUpToError.split('\n');
      return {
        line: lines.length,
        column: lines[lines.length - 1].length + 1
      };
    }

    return null;
  }

  // 4. Tree Parser & Node Builder
  function parseAndRenderTree() {
    const raw = jsonInput.value.trim();
    if (!raw) {
      viewerOutput.innerHTML = '<span style="color: var(--text-muted);">Empty JSON input.</span>';
      return;
    }

    try {
      const parsed = JSON.parse(raw);
      viewerOutput.innerHTML = '';
      viewerOutput.appendChild(buildTreeNode(parsed, null, true));
    } catch (err) {
      const loc = getErrorLocation(jsonInput.value, err);
      const locHtml = loc
        ? `<div class="error-loc">📍 <strong>Error detected at:</strong> Line <code>${loc.line}</code>, Column <code>${loc.column}</code></div>`
        : '';

      viewerOutput.innerHTML = `
        <div class="error-box">
          <div class="error-badge">Syntax Error</div>
          <div>${escapeHtml(err.message)}</div>
          ${locHtml}
        </div>`;
    }
  }

  function buildTreeNode(val, key = null, isLast = true) {
    const isArray = Array.isArray(val);
    const isObject = val !== null && typeof val === 'object';
    const container = document.createElement('div');
    container.className = 'tree-item';

    if (isObject) {
      const keys = Object.keys(val);
      const openBracket = isArray ? '[' : '{';
      const closeBracket = isArray ? ']' : '}';
      const count = keys.length;

      // Row Header
      const row = document.createElement('div');
      row.className = 'tree-row';

      const caret = document.createElement('span');
      caret.className = 'caret-btn';
      caret.textContent = '▼';

      let keyPrefix = '';
      if (key !== null) {
        keyPrefix = `<span class="key">"${escapeHtml(key)}"</span>: `;
      }

      row.innerHTML = `${keyPrefix}<span class="bracket">${openBracket}</span>`;
      row.prepend(caret);

      const summaryBadge = document.createElement('span');
      summaryBadge.className = 'badge-summary';
      summaryBadge.textContent = `${count} ${isArray ? 'items' : 'keys'} ${closeBracket}`;
      row.appendChild(summaryBadge);

      // Event listener for expanding/collapsing individual inner nodes
      const toggleCollapse = (event) => {
        event.stopPropagation();
        container.classList.toggle('collapsed');
      };

      caret.addEventListener('click', toggleCollapse);
      summaryBadge.addEventListener('click', toggleCollapse);

      // Child Items Container
      const childrenWrapper = document.createElement('div');
      childrenWrapper.className = 'tree-children';

      keys.forEach((k, idx) => {
        const isChildLast = idx === keys.length - 1;
        const childNode = buildTreeNode(val[k], isArray ? null : k, isChildLast);
        childrenWrapper.appendChild(childNode);
      });

      // Closing Bracket Row
      const closingRow = document.createElement('div');
      closingRow.className = 'tree-row';
      closingRow.innerHTML = `<span class="bracket">${closeBracket}</span>${!isLast ? '<span class="comma">,</span>' : ''}`;

      container.appendChild(row);
      container.appendChild(childrenWrapper);
      container.appendChild(closingRow);
    } else {
      // Primitive Values
      const row = document.createElement('div');
      row.className = 'tree-row';

      let formattedVal = '';
      if (typeof val === 'string') {
        formattedVal = `<span class="str">"${escapeHtml(val)}"</span>`;
      } else if (typeof val === 'number') {
        formattedVal = `<span class="num">${val}</span>`;
      } else if (typeof val === 'boolean') {
        formattedVal = `<span class="bool">${val}</span>`;
      } else if (val === null) {
        formattedVal = `<span class="null">null</span>`;
      }

      let keyPrefix = '';
      if (key !== null) {
        keyPrefix = `<span class="key">"${escapeHtml(key)}"</span>: `;
      }

      row.innerHTML = `<span style="width:16px; display:inline-block;"></span>${keyPrefix}${formattedVal}${!isLast ? '<span class="comma">,</span>' : ''}`;
      container.appendChild(row);
    }

    return container;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 5. Toolbar Actions
  document.getElementById('btn-format').addEventListener('click', () => {
    try {
      const obj = JSON.parse(jsonInput.value);
      jsonInput.value = JSON.stringify(obj, null, 2);
      updateLineNumbers();
      if (treeToggle.checked) parseAndRenderTree();
    } catch { parseAndRenderTree(); }
  });

  document.getElementById('btn-minify').addEventListener('click', () => {
    try {
      const obj = JSON.parse(jsonInput.value);
      jsonInput.value = JSON.stringify(obj);
      updateLineNumbers();
      if (treeToggle.checked) parseAndRenderTree();
    } catch { parseAndRenderTree(); }
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    jsonInput.value = '';
    updateLineNumbers();
    parseAndRenderTree();
  });

  document.getElementById('btn-expand-all').addEventListener('click', () => {
    document.querySelectorAll('.tree-item.collapsed').forEach(el => el.classList.remove('collapsed'));
  });

  document.getElementById('btn-collapse-all').addEventListener('click', () => {
    document.querySelectorAll('.tree-item').forEach(el => {
      if (el.querySelector('.tree-children')) {
        el.classList.add('collapsed');
      }
    });
  });

  // Initial Execution on Load
  updateLineNumbers();
  parseAndRenderTree();
</script>
</body>
</html>
