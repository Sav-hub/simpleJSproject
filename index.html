<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Viewer & Formatter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #e2e8f0;
      --key-color: #38bdf8;
      --string-color: #4ade80;
      --num-color: #fb923c;
      --bool-color: #c084fc;
      --null-color: #94a3b8;
      --border: #334155;
      --accent: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: calc(100vh - 50px);
    }

    .pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .actions { display: flex; gap: 8px; }
    button {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: #475569; }
    button.primary { background: var(--accent); color: white; }
    button.primary:hover { background: #4f46e5; }

    textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    #viewer-output {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Tree Styling */
    .tree-node { margin-left: 18px; position: relative; }
    .toggle {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
    }
    .toggle::before {
      content: '▾';
      display: inline-block;
      width: 14px;
      transition: transform 0.15s ease;
      color: #94a3b8;
    }
    .toggle.collapsed::before {
      transform: rotate(-90deg);
    }
    .collapsed + .node-content { display: none; }
    .collapsed-placeholder {
      display: none;
      color: #64748b;
      font-style: italic;
      cursor: pointer;
    }
    .collapsed + .node-content + .collapsed-placeholder {
      display: inline;
    }

    .item-count {
      color: #64748b;
      font-size: 11px;
      margin: 0 4px;
    }

    .key { color: var(--key-color); }
    .str { color: var(--string-color); }
    .num { color: var(--num-color); }
    .bool { color: var(--bool-color); }
    .null { color: var(--null-color); font-weight: bold; }
    .error-box {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Input Pane -->
  <div class="pane">
    <div class="header">
      <strong>Raw JSON</strong>
      <div class="actions">
        <button id="btn-format" class="primary">Format & View</button>
        <button id="btn-minify">Minify</button>
        <button id="btn-clear">Clear</button>
      </div>
    </div>
    <textarea id="json-input" placeholder="Paste your JSON here...">
{
  "project": "JSON Tree Viewer",
  "version": 2.0,
  "isActive": true,
  "license": null,
  "author": {
    "name": "Alex",
    "role": "Developer"
  },
  "tags": ["html", "javascript", "json", "tree-view"],
  "stats": {
    "downloads": 14200,
    "rating": 4.9
  }
}</textarea>
  </div>

  <!-- Output Tree Pane -->
  <div class="pane">
    <div class="header">
      <strong>Tree View</strong>
      <div class="actions">
        <button id="btn-expand-all">Expand All</button>
        <button id="btn-collapse-all">Collapse All</button>
      </div>
    </div>
    <div id="viewer-output"></div>
  </div>
</div>

<script>
  const jsonInput = document.getElementById('json-input');
  const viewerOutput = document.getElementById('viewer-output');

  function parseAndRender() {
    const raw = jsonInput.value.trim();
    if (!raw) {
      viewerOutput.innerHTML = '<span style="color:#64748b;">No data to display.</span>';
      return;
    }

    try {
      const parsed = JSON.parse(raw);
      viewerOutput.innerHTML = '';
      viewerOutput.appendChild(buildTreeDOM(parsed));
    } catch (err) {
      viewerOutput.innerHTML = `<div class="error-box"><strong>Invalid JSON:</strong><br>${err.message}</div>`;
    }
  }

  function buildTreeDOM(val, key = null) {
    const wrapper = document.createElement('div');
    const isArray = Array.isArray(val);
    const isObject = val !== null && typeof val === 'object';

    if (isObject) {
      const isArr = isArray;
      const keys = Object.keys(val);
      const openBracket = isArr ? '[' : '{';
      const closeBracket = isArr ? ']' : '}';

      const toggleSpan = document.createElement('span');
      toggleSpan.className = 'toggle';

      let keyPrefix = '';
      if (key !== null) {
        keyPrefix = `<span class="key">"${key}"</span>: `;
      }
      toggleSpan.innerHTML = `${keyPrefix}${openBracket}<span class="item-count">${keys.length} items</span>`;

      toggleSpan.onclick = () => {
        toggleSpan.classList.toggle('collapsed');
      };

      const content = document.createElement('div');
      content.className = 'node-content tree-node';

      keys.forEach((k, i) => {
        const itemKey = isArr ? null : k;
        const itemNode = buildTreeDOM(val[k], itemKey);
        if (i < keys.length - 1) {
          itemNode.innerHTML += '<span style="color:#94a3b8">,</span>';
        }
        content.appendChild(itemNode);
      });

      const placeholder = document.createElement('span');
      placeholder.className = 'collapsed-placeholder';
      placeholder.textContent = ' ... ';
      placeholder.onclick = () => toggleSpan.classList.remove('collapsed');

      const closing = document.createElement('span');
      closing.textContent = closeBracket;

      wrapper.appendChild(toggleSpan);
      wrapper.appendChild(content);
      wrapper.appendChild(placeholder);
      wrapper.appendChild(closing);
    } else {
      // Primitive types
      let formattedVal = '';
      if (typeof val === 'string') {
        formattedVal = `<span class="str">"${escapeHtml(val)}"</span>`;
      } else if (typeof val === 'number') {
        formattedVal = `<span class="num">${val}</span>`;
      } else if (typeof val === 'boolean') {
        formattedVal = `<span class="bool">${val}</span>`;
      } else if (val === null) {
        formattedVal = `<span class="null">null</span>`;
      }

      if (key !== null) {
        wrapper.innerHTML = `<span class="key">"${key}"</span>: ${formattedVal}`;
      } else {
        wrapper.innerHTML = formattedVal;
      }
    }
    return wrapper;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Event Listeners
  document.getElementById('btn-format').addEventListener('click', () => {
    try {
      const obj = JSON.parse(jsonInput.value);
      jsonInput.value = JSON.stringify(obj, null, 2);
      parseAndRender();
    } catch { parseAndRender(); }
  });

  document.getElementById('btn-minify').addEventListener('click', () => {
    try {
      jsonInput.value = JSON.stringify(JSON.parse(jsonInput.value));
      parseAndRender();
    } catch { parseAndRender(); }
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    jsonInput.value = '';
    parseAndRender();
  });

  document.getElementById('btn-expand-all').addEventListener('click', () => {
    document.querySelectorAll('.toggle.collapsed').forEach(el => el.classList.remove('collapsed'));
  });

  document.getElementById('btn-collapse-all').addEventListener('click', () => {
    document.querySelectorAll('.toggle').forEach(el => el.classList.add('collapsed'));
  });

  // Initial parse on page load
  parseAndRender();
</script>
</body>
</html>
